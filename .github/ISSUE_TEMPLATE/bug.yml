name: Bug report
description: Report a gameplay, terminal, rendering, or server problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the exact keys or flow that produced the issue.
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal and SSH client
      placeholder: "Windows Terminal 1.x, OpenSSH 9.x"
    validations:
      required: true
  - type: input
    id: size
    attributes:
      label: Terminal dimensions
      placeholder: "120x40"
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove private keys, passwords, tokens, and webhook URLs first.
